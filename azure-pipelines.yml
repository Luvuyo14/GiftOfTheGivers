# Build, test, report and deploy (web app + Azure Function) pipeline for Gift of the Givers
trigger:
  branches:
    include:
      - main

pool:
  vmImage: 'windows-latest'

variables:
  buildConfiguration: 'Release'
  solutionPath: '**/*.sln'
  testProject: '**/GiftOfTheGivers2.Tests.csproj'
  webAppName: 'GiftOfTheGivers220260825234617'
  siteHost: 'giftofthegivers220260825234617-hte3byf3cah8bffe.southafricanorth-01.azurewebsites.net'
  scmHost: 'giftofthegivers220260825234617-hte3byf3cah8bffe.scm.southafricanorth-01.azurewebsites.net'
  funcAppName: 'GiftOfTheGiversAWS'
  funcHost: 'giftofthegiversaws-gtbdeygkbzd7acdw.southafricanorth-01.azurewebsites.net'
  funcScmHost: 'giftofthegiversaws-gtbdeygkbzd7acdw.scm.southafricanorth-01.azurewebsites.net'
  sqlServerHost: 'st10442920.database.windows.net'
  sqlDatabaseName: 'GiftOfTheGiversDB'

stages:
- stage: Build
  displayName: 'Build and test'
  jobs:
  - job: BuildAndTest
    displayName: 'Build, test and package'
    steps:
    - task: NuGetToolInstaller@1
      displayName: 'Install NuGet'

    - task: NuGetAuthenticate@1
      displayName: 'Authenticate with Azure Artifacts feed'

    - task: DotNetCoreCLI@2
      displayName: 'Restore dependencies'
      inputs:
        command: 'restore'
        projects: '$(solutionPath)'
        feedsToUse: 'config'
        nugetConfigPath: 'NuGet.config'

    - task: DotNetCoreCLI@2
      displayName: 'Build solution'
      inputs:
        command: 'build'
        projects: '$(solutionPath)'
        arguments: '--configuration $(buildConfiguration) --no-restore'

    - task: DotNetCoreCLI@2
      displayName: 'Run unit and integration tests with coverage'
      inputs:
        command: 'test'
        projects: '$(testProject)'
        arguments: '--configuration $(buildConfiguration) --no-build --collect:"XPlat Code Coverage"'
        publishTestResults: true
        testRunTitle: 'Unit and integration tests'

    - task: PublishCodeCoverageResults@2
      displayName: 'Publish code coverage report'
      condition: succeededOrFailed()
      inputs:
        summaryFileLocation: '$(Agent.TempDirectory)/**/coverage.cobertura.xml'
        failIfCoverageEmpty: false

    - task: DotNetCoreCLI@2
      displayName: 'Publish web app package'
      inputs:
        command: 'publish'
        publishWebProjects: true
        arguments: '--configuration $(buildConfiguration) --no-restore --output $(Build.ArtifactStagingDirectory)/web'
        zipAfterPublish: true

    - publish: '$(Build.ArtifactStagingDirectory)/web'
      artifact: 'webapp'
      displayName: 'Save web app package as build artifact'

    - task: DotNetCoreCLI@2
      displayName: 'Publish Azure Function package'
      inputs:
        command: 'publish'
        publishWebProjects: false
        projects: '**/GiftOfTheGivers2.function.csproj'
        arguments: '--configuration $(buildConfiguration) --no-restore --output $(Build.ArtifactStagingDirectory)/func'
        zipAfterPublish: true
        modifyOutputPath: false

    - publish: '$(Build.ArtifactStagingDirectory)/func'
      artifact: 'funcapp'
      displayName: 'Save function package as build artifact'

    - script: |
        echo Secret key value (masked below):
        echo $(DummyApiKey)
      displayName: 'Demonstrate secret variable usage (masked in logs)'
      env:
        DummyApiKey: $(DummyApiKey)

- stage: Deploy
  displayName: 'Deploy to Azure'
  dependsOn: Build
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
  jobs:
  - job: DeployWebApp
    displayName: 'Deploy web app'
    steps:
    - download: current
      artifact: webapp
      displayName: 'Download web app package'

    - task: PowerShell@2
      displayName: 'Deploy package to App Service (zip deploy, with retries)'
      env:
        DEPLOY_USER: $(DeployUser)
        DEPLOY_PASSWORD: $(DeployPassword)
      inputs:
        targetType: 'inline'
        script: |
          $ProgressPreference = 'SilentlyContinue'
          $zip = Get-ChildItem "$(Pipeline.Workspace)/webapp" -Filter *.zip -Recurse | Select-Object -First 1
          if (-not $zip) { Write-Error "No package found to deploy."; exit 1 }
          Write-Host ("Deploying package: " + $zip.Name)
          $pair = $env:DEPLOY_USER + ":" + $env:DEPLOY_PASSWORD
          $token = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes($pair))
          $uri = "https://$(scmHost)/api/zipdeploy"
          $done = $false
          for ($i = 1; $i -le 3; $i++) {
            try {
              Invoke-RestMethod -Uri $uri -Method POST -InFile $zip.FullName -ContentType "application/zip" -Headers @{ Authorization = "Basic $token" } -TimeoutSec 600
              Write-Host ("Attempt " + $i + ": package deployed to $(webAppName)")
              $done = $true
              break
            } catch {
              Write-Host ("Attempt " + $i + " failed: " + $_.Exception.Message)
              Start-Sleep -Seconds 20
            }
          }
          if (-not $done) { Write-Error "Deployment failed after 3 attempts."; exit 1 }

    - task: PowerShell@2
      displayName: 'Smoke test the live site (with retries)'
      inputs:
        targetType: 'inline'
        script: |
          $url = 'https://$(siteHost)/Donation'
          $ok = $false
          for ($i = 1; $i -le 6; $i++) {
            try {
              $r = Invoke-WebRequest -Uri $url -UseBasicParsing -TimeoutSec 60
              Write-Host ('Attempt {0}: the live site returned HTTP {1}' -f $i, $r.StatusCode)
              if ($r.StatusCode -eq 200) { $ok = $true; break }
            } catch {
              Write-Host ('Attempt {0} failed: {1}' -f $i, $_.Exception.Message)
            }
            Start-Sleep -Seconds 15
          }
          if (-not $ok) { Write-Error 'Smoke test failed: the live site did not return HTTP 200.'; exit 1 }

  - job: DeployFunction
    displayName: 'Deploy Azure Function'
    steps:
    - download: current
      artifact: funcapp
      displayName: 'Download function package'

    - task: PowerShell@2
      displayName: 'Deploy function package (zip deploy, with retries)'
      env:
        DEPLOY_USER: $(FuncDeployUser)
        DEPLOY_PASSWORD: $(FuncDeployPassword)
      inputs:
        targetType: 'inline'
        script: |
          $ProgressPreference = 'SilentlyContinue'
          $zip = Get-ChildItem "$(Pipeline.Workspace)/funcapp" -Filter *.zip -Recurse | Select-Object -First 1
          if (-not $zip) { Write-Error "No function package found to deploy."; exit 1 }
          Write-Host ("Deploying package: " + $zip.Name)
          $pair = $env:DEPLOY_USER + ":" + $env:DEPLOY_PASSWORD
          $token = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes($pair))
          $uri = "https://$(funcScmHost)/api/zipdeploy"
          $done = $false
          for ($i = 1; $i -le 3; $i++) {
            try {
              Invoke-RestMethod -Uri $uri -Method POST -InFile $zip.FullName -ContentType "application/zip" -Headers @{ Authorization = "Basic $token" } -TimeoutSec 600
              Write-Host ("Attempt " + $i + ": package deployed to $(funcAppName)")
              $done = $true
              break
            } catch {
              Write-Host ("Attempt " + $i + " failed: " + $_.Exception.Message)
              Start-Sleep -Seconds 20
            }
          }
          if (-not $done) { Write-Error "Function deployment failed after 3 attempts."; exit 1 }

    - task: PowerShell@2
      displayName: 'Test the live function with input (with retries)'
      env:
        FUNC_KEY: $(FuncKey)
      inputs:
        targetType: 'inline'
        script: |
          $ProgressPreference = 'SilentlyContinue'
          $base = 'https://$(funcHost)'
          $up = $false
          for ($i = 1; $i -le 8; $i++) {
            try {
              $r = Invoke-WebRequest -Uri $base -UseBasicParsing -TimeoutSec 60
              Write-Host ('Attempt {0}: the function app returned HTTP {1}' -f $i, $r.StatusCode)
              if ($r.StatusCode -eq 200) { $up = $true; break }
            } catch {
              Write-Host ('Attempt {0} failed: {1}' -f $i, $_.Exception.Message)
            }
            Start-Sleep -Seconds 15
          }
          if (-not $up) { Write-Error 'Function app did not respond with HTTP 200.'; exit 1 }

          $body = '{"DonorName":"Pipeline Tester","Amount":250,"Currency":"USD","DonationType":"Recurring"}'
          $uri = $base + '/api/GenerateTaxCertificate?code=' + $env:FUNC_KEY
          $result = $null
          for ($i = 1; $i -le 5; $i++) {
            try {
              $result = Invoke-RestMethod -Uri $uri -Method POST -Body $body -ContentType 'application/json' -TimeoutSec 60
              break
            } catch {
              Write-Host ('Certificate call attempt {0} failed: {1}' -f $i, $_.Exception.Message)
              Start-Sleep -Seconds 15
            }
          }
          if (-not $result) { Write-Error 'The function did not return a certificate.'; exit 1 }
          Write-Host 'Function response:'
          Write-Host ($result | ConvertTo-Json)
          if ($result.donorName -ne 'Pipeline Tester' -or $result.certificateNumber -notlike 'GOTG-TAX-*') {
            Write-Error 'Unexpected response from the function.'
            exit 1
          }
          Write-Host 'Function test passed.'
  - job: DeployDatabase
    displayName: 'Deploy database schema (versioned migrations)'
    steps:
    - task: PowerShell@2
      displayName: 'Apply pending SQL migrations'
      env:
        SQL_USER: $(SqlAdminUser)
        SQL_PASSWORD: $(SqlAdminPassword)
      inputs:
        targetType: 'inline'
        script: |
          & '$(Build.SourcesDirectory)\database\deploy-database.ps1' -Server '$(sqlServerHost)' -Database '$(sqlDatabaseName)' -User $env:SQL_USER -Password $env:SQL_PASSWORD -Operator 'azure-pipeline'