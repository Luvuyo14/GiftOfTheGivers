# Build, test and report pipeline for Gift of the Givers
trigger:
  branches:
    include:
      - main

pool:
  vmImage: 'windows-latest'

variables:
  buildConfiguration: 'Release'
  solutionPath: '**/*.sln'
  testProject: '**/GiftOfTheGivers2.Tests.csproj'

steps:
- task: NuGetToolInstaller@1
  displayName: 'Install NuGet'

- task: NuGetAuthenticate@1
  displayName: 'Authenticate with Azure Artifacts feed'

- task: DotNetCoreCLI@2
  displayName: 'Restore dependencies'
  inputs:
    command: 'restore'
    projects: '$(solutionPath)'
    feedsToUse: 'config'
    nugetConfigPath: 'NuGet.config'

- task: DotNetCoreCLI@2
  displayName: 'Build solution'
  inputs:
    command: 'build'
    projects: '$(solutionPath)'
    arguments: '--configuration $(buildConfiguration) --no-restore'

- task: DotNetCoreCLI@2
  displayName: 'Run unit and integration tests with coverage'
  inputs:
    command: 'test'
    projects: '$(testProject)'
    arguments: '--configuration $(buildConfiguration) --no-build --collect:"XPlat Code Coverage"'
    publishTestResults: true
    testRunTitle: 'Unit and integration tests'

- task: PublishCodeCoverageResults@2
  displayName: 'Publish code coverage report'
  condition: succeededOrFailed()
  inputs:
    summaryFileLocation: '$(Agent.TempDirectory)/**/coverage.cobertura.xml'
    failIfCoverageEmpty: false

- script: |
    echo Secret key value (masked below):
    echo $(DummyApiKey)
  displayName: 'Demonstrate secret variable usage (masked in logs)'
  env:
    DummyApiKey: $(DummyApiKey)