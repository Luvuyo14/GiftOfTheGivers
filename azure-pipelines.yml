      displayName: 'Smoke test the live site (with retries)'
      inputs:
        targetType: 'inline'
        script: |
          $url = "https://$(siteHost)/Donation"
          $ok = $false
          for ($i = 1; $i -le 6; $i++) {
            try {
              $r = Invoke-WebRequest -Uri $url -UseBasicParsing -TimeoutSec 60
              Write-Host ("Attempt " + $i + ":